name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Backup files
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/
          cp pubspec.yaml /tmp/backup/
      - name: Create Flutter project
        run: flutter create --org com.apms --project-name ali_public_school .
      - name: Restore files
        run: |
          rm -rf lib
          cp -r /tmp/backup/lib ./
          cp /tmp/backup/pubspec.yaml ./
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ali-public-school-apk
          path: build/app/outputs/flutter-apk/app-release.apk
